aid: earth-ai
name: Earth AI
description: >-
  Earth AI is a vertically integrated, AI-powered mineral exploration company
  that discovers, develops, and owns critical mineral mines for the emerging
  hardware economy — data centers, humanoid robots, eVTOL aircraft, fusion
  energy, space, and defense. Its proprietary predictive model, MTP, is trained
  on roughly 400 million geological sites to identify the source rocks of new
  mineral deposits and dramatically compress traditional exploration timelines.
  The company vertically integrates the search for critical minerals: it
  predicts targets with AI, acquires mineral rights, and drills to prove and own
  the resource. Earth AI is backed by DCVC and has been profiled by TechCrunch,
  Business Insider, and The Generalist's Future 50. This profile is maintained
  in the API Evangelist network; Earth AI does not currently publish a public
  developer API, SDKs, or API documentation.
